<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Fruit AR - Học tiếng Anh thực tế tăng cường</title>
    
    <!-- Nhúng thư viện A-Frame và MindAR -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <!-- Nhúng thư viện xử lý vuốt chạm tương tác (Gesture Detector) -->
    <script src="https://githack.com"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    
    <!-- Kích hoạt tính năng nhận diện ảnh mục tiêu và bộ dò vuốt chạm toàn màn hình -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      gesture-detector
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Khai báo file mô hình 3D quả táo mới của bạn -->
        <a-asset-item id="appleModel" src="./tao111.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-camera>

      <!-- Vùng nhận diện hình ảnh (targetIndex: 0 nghĩa là hình ảnh mục tiêu đầu tiên) -->
      
        
        <!-- Mô hình quả táo tích hợp hoạt ảnh phóng to và tính năng vuốt chạm tương tác -->
        <a-gltf-model 
          src="#appleModel" 
          position="0 0 0" 
          rotation="0 0 0" 
          scale="0 0 0"
          class="clickable"
          gesture-handler="minScale: 0.05; maxScale: 1"
          animation="property: scale; to: 0.15 0.15 0.15; dur: 1500; easing: easeOutBack; startEvents: targetFound">
        </a-gltf-model>
        
      
    </a-scene>
    
  </body>
</html>
